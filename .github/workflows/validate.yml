name: Validate Shoghl Dakahlia
on:
  push:
    branches: ["main", "improve/**"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Check app files and JavaScript syntax
        run: node scripts/check-app.mjs
